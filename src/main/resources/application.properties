# -----------------------------------------------------------------------------
# Application identity
# -----------------------------------------------------------------------------
spring.application.name=employee-management
server.port=8080

# -----------------------------------------------------------------------------
# H2 in-memory database
#
# jdbc:h2:mem:employeedb  -> lives only while the JVM is running.
# DB_CLOSE_DELAY=-1       -> keep the DB alive until the JVM exits (important
#                            because Spring opens more than one connection).
#
# Interview tip: H2 is an embedded database. Perfect for learning and tests.
# Production apps typically use PostgreSQL or MySQL instead.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------------------------
# JPA / Hibernate
#
# ddl-auto=update  -> Hibernate creates/updates tables from @Entity classes.
# show-sql=true    -> log the SQL so you can see what Hibernate generates.
#
# Interview tip: never use update/create-drop in production. Use Flyway or
# Liquibase migrations instead.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# H2 web console  -> http://localhost:8080/h2-console
# JDBC URL to enter in the console: jdbc:h2:mem:employeedb
# User: sa   Password: (leave empty)
#
# spring-boot-h2console is a dedicated Spring Boot 4 module. The console is
# registered only when spring.h2.console.enabled=true.
# -----------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Sample data
# Set to false if you want to start with an empty database.
# -----------------------------------------------------------------------------
app.seed-data.enabled=true
